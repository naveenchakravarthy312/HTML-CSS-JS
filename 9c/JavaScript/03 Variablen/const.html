<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <title>Constant</title>
        <meta name="author" content="Naveen Chakravarthy Mohankumar">
        <meta name="date" content="07.05.2026">
    </head>

    <body>
        <script>
            const euler = 2.718; // euler wird permanent das Wert 2.718 zugewiesen
            const Pi = 3.142; // Pi wird permanent das Wert 3.142 zugewiesen
            document.write(euler); // Screibt das wert das zu euler zugewiesen wurde
            document.write(Pi); // Screibt das wert das zu Pi zugewiesen wurde, neben das wert von euler, weil es kein <br> befindeet
        </script>
    </body>
</html>
