<!doctype html>
<html lang="de">
    <head>
        <!-- Meta -->
        <meta charset="utf-8">
        <title>Variablen</title>
        <meta name="author" content="Naveen Chakravarthy Mohankumar">
        <meta name="date" content="07.05.2026">
    </head>

    <body>

        <!-- Script -> hier JavaScript -->
        <script>
            var breit = 15; //Der Variable breit wird das Wert 15 zugewiesen
            var hoch = 5; //Der Variable hoch wird das Wert 5 zugewiesen
            var flaeche; //Die Variable flaeche wird undefiniert deklariert
            var ausgabe = "Das Ergebnis: "; //Der Variable ausgabe wird das Wert "Das Ergebnis: " zugewiesen
            flaeche = breit * hoch; // Vorher undefined wird das wert von breit mal hoch zugewiesen
            document.write(ausgabe); // Auf der document wird das Wert von ausgabe ausgegeben
            document.write(flaeche); // Daneben wird das Wert von flaeche ausgegeben
        </script>
    </body>
</html>
