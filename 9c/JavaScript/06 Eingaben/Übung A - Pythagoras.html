<!doctype html>
<html lang="de">
    <head>
        <!-- Meta -->
        <meta charset="utf-8">
        <title>Übung A: Pythagoras</title>
        <meta name="author" content="Naveen Chakravarthy Mohankumar">
        <meta name="date" content="30.04.2026">

        <!-- Style -->
        <style>
            .card {
                background: #357096;
                border-radius: 12px;
                padding: 20px;
                margin: 15px;
                box-shadow: 2px 2px 4px rgba(102, 102, 102, 0.7);
                text-align: center;
                border: 5px solid #024c7c;
            }
            input {
                display: block;
                margin: 10px 0;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
                width: 90%;
            }
            button {
                background-color: #024c7c;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
            }
            button:hover {
                background-color: #002842;
            }
            h1 {
                color: #ffffff;
            }
        </style>
    </head>

    <body>

        <!-- Container -->
        <div class="card">

            <!-- Überschribt -->
            <h1>Übung A: Pythagoras</h1>

            <!-- Script -> hier JavaScript -->
            <script>

                // Funktion
                function pytagoras() {

                    // Variablen
                    var a = document.getElementById("a").value;
                    var b = document.getElementById("b").value;

                    //Varaiblen mit eine Formel zuweisen
                    var c = Math.pow(a, 2) + Math.pow(b, 2);
                    c = Math.sqrt(c);

                    // Ausgabe in HTML
                    document.getElementById("answer").innerHTML = c;
                    return;
                }
            </script>

            <!-- Input -->
            <input type="number" id="a" placeholder="a?">
            <input type="number" id="b" placeholder="b?">
            
            <!-- Funktion ausführen -->
            <button onClick="pytagoras();">Solve</button> 

            <!-- Output -->
            <p id="answer"></p>
        </div>
    </body>
</html>
