<!doctype html>
<html lang="de">
    <head>
        <!-- Meta -->
        <meta charset="utf-8">
        <title>Rabattberechnung</title>
        <meta name="author" content="Naveen Chakravarthy Mohankumar">
        <meta name="date" content="14.05.2026">

        <!-- Style -->
        <style>
            .card {
                background: #357096;
                border-radius: 12px;
                padding: 20px;
                margin: 15px;
                box-shadow: 2px 2px 4px rgba(102, 102, 102, 0.7);
                text-align: center;
                border: 5px solid #024c7c;
                font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
            }
            input {
                display: block;
                margin: 10px 0 0;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
                width: 100%;
                margin: 10px;
            }
            button {
                background-color: #024c7c;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
                margin: 10px;
            }
            button:hover {
                background-color: #002842;
            }
            h1 {
                color: #ffffff;
            }
            .flexbox {
                display: flex;
                justify-content: space-between;
            }
            #output {
                background-color: #ffffff;
                padding: 30px;
                border-radius: 10px;
            }
        </style>
    </head>

    <body>
        <div class="card">
            <script>
                function Bestellen() {

                    // Varianble
                    var anzahl = document.getElementById("anzahl").value;

                    // if-else
                    if (anzahl < 8) {
                        var rabatt = 1;
                        var percent = "0%";
                    }
                    if (anzahl >= 8) {
                        var rabatt = 0.95;
                        var percent = "5%";
                    }
                    if (anzahl >= 16) {
                        var rabatt = 0.88;
                        var percent = "12%";
                    }

                    // Variablen berechnung
                    var price = anzahl * 12.40;
                    var sum = price * rabatt;
                    var rabattpercent = price - sum;

                    // Output
                    var output = "Sie haben " + anzahl + " Flachen bestellt!<br>" + "Sie bekommen " + percent + " Rabatt.<br>Brutto: €" + price.toFixed(2) + " - Rabatt: €" + rabattpercent.toFixed(2) + " = €" + sum.toFixed(2);
                    document.getElementById("output").innerHTML = output;
                }
            </script>

            <!-- Title -->
            <h1>Rabattberechnung</h1>
        
            <!-- Input -->
            <div class="flexbox">
                <p>Anzahl:</p><input type="number" id="anzahl" placeholder="Anzahl eingeben"><p>Flachen</p>
                <button onclick="Bestellen()">Bestellen</button>
            </div>

            <!-- Output -->
            <p id="output">Wie viele Flachen á €12,40 möchten Sie bestellen?</p>
        </div>
    </body>
</html>
