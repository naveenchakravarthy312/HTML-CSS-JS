<!doctype html>
<html lang="de">
    <!-- Meta -->
    <head>
        <meta charset="utf-8">
        <title>Kopfgesteuerte Schleife</title>
        <meta name="author" content="Naveen Chakravarthy Mohankumar">
        <meta name="date" content="14.06.2026">
    </head>

    <body>
        <p>Du musstest <span id="ausgabe"></span> mal raten !</p>

        <!-- Script -> hier JavaScript -->
        <script>
            var eingabe = "";
            var versuch = 0;
            while (eingabe != "Innsbruck") {
                eingabe = window. prompt ("Hauptstadt von Tirol?");
                versuch ++;
                document.getElementById ("ausgabe") .innerHTML = versuch; }
        </script>
    </body>
</html>
