<!doctype html>
<html lang="de">
    <!-- Meta -->
    <head>
        <meta charset="utf-8">
        <title>Fussgesteuerte Schleife</title>
        <meta name="author" content="Naveen Chakravarthy Mohankumar">
        <meta name="date" content="14.06.2026">
    </head>

    <body>
        <!-- Script -> hier JavaScript -->
        <script>
            var eingabe = "";
            var zaehler = 0;
            do {eingabe = window.prompt("Mathequiz: 4 x 3 = ?");
                zaehler ++;
                if(eingabe == 12) {
                    window.alert("Bravo! " + zaehler + " Versuche");
                    break;
                }   }
            while (eingabe != 12);
        </script>
    </body>
</html>
