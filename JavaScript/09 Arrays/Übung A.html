<!doctype html>
<html lang="de">
    <!-- Meta -->
    <head>
        <meta charset="utf-8">
        <title>Österreichische Offiziere</title>
        <meta name="author" content="Naveen Chakravarthy Mohankumar">
        <meta name="date" content="14.06.2026">
        <style>
            .card {
                background: #357096;
                border-radius: 12px;
                padding: 20px;
                margin: 15px;
                box-shadow: 2px 2px 4px rgba(102, 102, 102, 0.7);
                text-align: center;
                border: 5px solid #024c7c;
                font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }
            input {
                display: block;
                margin: 10px 0 0;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
                width: 95%;
                margin: 10px;
            }
            button {
                background-color: #024c7c;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
                margin: 10px;
            }
            button:hover {
                background-color: #002842;
            }
            h1 {
                color: #ffffff;
            }
            #output {
                background-color: #ffffff;
                padding: 30px;
                border-radius: 10px;
            }
        </style>
    </head>

    <body>
        <!-- Script -> hier JavaScript -->
        <script>
            var offiziersrang = ["Fähnrich", "Leutnant", "Oberleutnant", "Hauptmann", "Major", "Oberstleutnant", "Oberst", "Brigadier", "Generalmajor", "Generallieutenant", "General"];
            function Rang() {
                var xy = document.getElementById("Offiziere").value;
                document.getElementById("output").innerHTML = "Sie sind ein " + offiziersrang[xy];
            }
        </script>
        <div class="card">
            <h1>Welche Offiziersrang sind sie in Österreich?</h1>
            <input id="Offiziere" type="number" placeholder=" Ein Zahl zwischne 0 und 10 bitte">
            <button onclick="Rang()">Klicke Hier</button>
            <p id="output">Sie sind ein...</p>
        </div>
    </body>
</html>
