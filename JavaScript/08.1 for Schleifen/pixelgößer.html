<!doctype html>
<html lang="de">
    <!-- Meta -->
    <head>
        <meta charset="utf-8">
        <title>Pixelgröße</title>
        <meta name="author" content="Naveen Chakravarthy Mohankumar">
        <meta name="date" content="14.06.2026">
    </head>

    <body>
        <!-- Script -> hier JavaScript -->
        <script>
            const anfang = '<p style="font-size:';
            const mitte = 'px">Schrift mit ';
            const schluss = ' Pixel Größe</p>';
            for (var i = 10; i <= 46; i = i + 2) {
                document.write(anfang + i + mitte + i + schluss);
            }
        </script>
    </body>
