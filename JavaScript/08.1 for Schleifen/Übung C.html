<!doctype html>
<html lang="de">
    <!-- Meta -->
    <head>
        <meta charset="utf-8">
        <title>Schleifen aller Arten</title>
        <meta name="author" content="Naveen Chakravarthy Mohankumar">
        <meta name="date" content="14.06.2026">
        <style>
            .card {
                background: #357096;
                border-radius: 12px;
                padding: 20px;
                margin: 15px;
                box-shadow: 2px 2px 4px rgba(102, 102, 102, 0.7);
                text-align: center;
                border: 5px solid #024c7c;
                font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }
            input {
                display: block;
                margin: 10px 0 0;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
                width: 95%;
                margin: 10px;
            }
            button {
                background-color: #024c7c;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
                margin: 10px;
            }
            button:hover {
                background-color: #002842;
            }
            h1 {
                color: #ffffff;
            }
            .output {
                background-color: #ffffff;
                padding: 30px;
                border-radius: 10px;
            }
        </style>
    </head>

    <body>
        <div class="card">
            <h1>Schleifen aller Arten</h1>
            <input type="number" id="von" placeholder="von">
            <input type="number" id="bis" placeholder="bis">
            <button onclick="prime()">Primzahlen</button>
            <p class="output" id="output1"></p>
        </div>

        <!-- Script -> hier JavaScript -->
        <script>
            function prime() {
                var von = document.getElementById("von").value;
                var bis = document.getElementById("bis").value;
                do {
                    if (von > 1) {
                        var prime = true;
                        for (var teiler = 2; teiler < i; teiler++) {
                            if (i % teiler == 0) {
                                prime = false; 
                            }
                        }
                        if (prime == true) {
                            ergebnis = ergebnis + i + " ";
                        }
                    }
                    i++;
                } 
                while (i <= bis);
                document.getElementById("output1").innerHTML = "Primzahlen: " + ergebnis;
            }
        </script>
    </body>
</html>
